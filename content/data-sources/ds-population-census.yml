id: ds-population-census
kind: type
order: 2
name_ar: التعداد العام للسكان
names:
  en: Population and housing census
  fr: Recensement général de la population et de l'habitat
summary_ai_ar: >-
  التعداد عدٌّ شامل لكل السكان في لحظة واحدة، عادة كل عشر سنوات. يتضمن أسئلة قليلة عن النشاط الاقتصادي، فيعطي صورة عن
  التشغيل والبطالة حتى أصغر وحدة إدارية، لكنه أقل دقة من مسح القوى العاملة في قياس البطالة. ودوره الأهم لإحصاءات العمل أنه
  يوفّر إطار المعاينة والتقديرات السكانية التي تُبنى عليها أوزان المسح.
official_quotes:
- slot: q-un-census-definition
  heading_ar: تعريف التعداد في توصيات الأمم المتحدة
- slot: q-ilo-qg-census
  heading_ar: التعداد مصدراً لإحصاءات العمل عند منظمة العمل الدولية
- slot: q-un-ilo-census-vs-lfs
  heading_ar: التعداد ومسح القوى العاملة
strengths_ai_ar:
- يغطي كل السكان، فيعطي أرقاماً لكل منطقة وكل فئة صغيرة.
- يوفّر إطار المعاينة لمسح القوى العاملة وللمسوح الأسرية الأخرى.
- يوفّر عدد السكان الذي تُعايَر عليه أوزان المسح.
limits_ai_ar:
- دورية بعيدة (عشر سنوات غالباً)، فلا يرصد التغيرات القصيرة الأجل.
- أسئلة النشاط قليلة ومختصرة، ويجمعها عدّادون أقل تخصصاً، فيقل التشغيل المسجَّل (خاصة عمل النساء والعمل غير المنظم) وتختلف البطالة عن المسح.
- قد يعتمد التعداد معايير أقدم من المسح، فلا تُقارن أرقام البطالة بينهما مباشرة.
