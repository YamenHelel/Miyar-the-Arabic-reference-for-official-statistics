id: ds-administrative-records
kind: type
order: 3
name_ar: السجلات الإدارية
names:
  en: Administrative records and registers
  fr: Sources administratives et registres
summary_ai_ar: >-
  السجلات الإدارية بيانات تجمعها جهات حكومية لأغراض عملها، لا لأغراض إحصائية: الضمان الاجتماعي، ومكاتب التشغيل، والخدمة
  المدنية، وتصاريح عمل الوافدين، والضرائب. تعطي أرقاماً شهرية شاملة ورخيصة عن العمل المسجَّل، لكنها تقيس ما يعرّفه القانون
  لا ما يعرّفه المعيار الإحصائي، فلا تُقارن بين الدول ولا تقيس البطالة بالمفهوم الدولي.
official_quotes:
- slot: q-ilo-qg-admin
  heading_ar: السجلات الإدارية عند منظمة العمل الدولية
- slot: q-ilo-ssm4-admin-intro
  heading_ar: إحصاءات العمل من السجلات الإدارية
what_ai_ar: >-
  أهم السجلات لإحصاءات العمل في الدول العشر: سجلات التأمينات والضمان الاجتماعي (المشتركون حسب القطاع والأجر)، وسجلات
  الخدمة المدنية (موظفو الحكومة)، وسجلات مكاتب التشغيل (طالبو العمل المسجلون)، وتصاريح العمل وإقامات الوافدين (مهمة جداً في
  دول الخليج)، وسجلات الضرائب، وسجلات تفتيش العمل وإصابات العمل.
strengths_ai_ar:
- شاملة للفئة التي يغطيها القانون، بلا خطأ معاينة.
- متاحة بسرعة وبدورية شهرية أحياناً، وبتكلفة إحصائية منخفضة.
- تصلح للمناطق الصغيرة وللقطاعات الدقيقة.
- مفيدة جداً للأجور في القطاع المنظم ولإصابات العمل والحماية الاجتماعية.
limits_ai_ar:
- تغطي العمل المسجَّل فقط؛ يغيب عنها العمل غير المنظم والعمل لحساب النفس غالباً.
- تعاريفها قانونية وإدارية؛ «طالب العمل المسجل» ليس «المتعطل» بالمفهوم الدولي.
- تتغير مع تغيّر القوانين والإجراءات، فتنقطع السلاسل لأسباب غير إحصائية.
- الوصول إليها يحتاج اتفاقات بين الجهاز الإحصائي والجهات المالكة، مع حماية البيانات الشخصية.
