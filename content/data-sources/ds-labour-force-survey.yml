id: ds-labour-force-survey
kind: type
order: 1
name_ar: مسح القوى العاملة
names:
  en: Labour force survey (LFS)
  fr: Enquête sur la population active / enquête emploi
summary_ai_ar: >-
  مسح القوى العاملة مسح أسري بالعينة يسأل أفراد الأسر عن نشاطهم خلال أسبوع محدد، ومنه تُحسب البطالة والعمالة والمشاركة
  وفق معايير المؤتمر الدولي لخبراء إحصاءات العمل. تعدّه منظمة العمل الدولية المصدر الرئيسي لإحصاءات القوى العاملة، لأنه
  المصدر الوحيد الذي يغطي كل السكان، بمن فيهم العاملون لحسابهم وفي القطاع غير المنظم والمتعطلون، بتعاريف موحدة.
official_quotes:
- slot: q-ilo-qg-lfs
  heading_ar: كيف تصف منظمة العمل الدولية مسح القوى العاملة
- slot: q-ilo-icls19-data-sources
  heading_ar: مصادر البيانات في قرار المؤتمر التاسع عشر
what_ai_ar: >-
  يُسحب عدد من المساكن من إطار معاينة (غالباً من آخر تعداد)، ثم يُسأل كل فرد في سن العمل: هل عمل ولو ساعة مقابل أجر أو ربح
  خلال أسبوع الإسناد؟ هل له عمل غاب عنه مؤقتاً؟ هل بحث عن عمل وهل هو متاح للبدء؟ من هذه الأجوبة يُصنَّف كل شخص مشتغلاً أو
  متعطلاً أو خارج القوة العاملة، ثم تُرجَّح النتائج بأوزان العينة لتمثل كل السكان.
strengths_ai_ar:
- يغطي كل أشكال العمل، بما فيها العمل لحساب النفس والعمل غير المنظم، لا العمل المسجَّل فقط.
- يطبّق التعريف الدولي للبطالة مباشرة (بلا عمل، يبحث، متاح)، فيمكن المقارنة بين الدول.
- يربط حالة العمل بخصائص الشخص والأسرة (السن، التعليم، الجنس، الجنسية).
- دورية متكررة (غالباً ربع سنوية) تتيح رصد التغيرات القصيرة الأجل.
limits_ai_ar:
- نتائج بالعينة، فلها خطأ معياري؛ التقديرات للمناطق الصغيرة أو الفئات النادرة غير دقيقة.
- مكلف ويحتاج فريقاً ميدانياً دائماً.
- يعتمد على تصريح المجيب أو من يجيب عنه، فيتأثر بالفهم والذاكرة (أخطاء غير المعاينة).
- قد لا يغطي من يعيشون خارج المساكن العادية (العمال في السكن الجماعي مثلاً)، وهذا مهم في دول الخليج.
- تغيير الاستمارة أو المعيار (من المؤتمر 13 إلى 19) يُحدث انقطاعاً في السلسلة.
