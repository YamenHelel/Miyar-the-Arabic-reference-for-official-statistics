name_ar: مسوح المؤسسات
names:
  en: Establishment (enterprise) surveys
  fr: Enquêtes auprès des établissements
summary_ai_ar: >-
  مسح المؤسسات يسأل المنشآت، لا الأسر، عن عدد العاملين لديها وأجورهم وساعات عملهم وتكلفة العمل والوظائف الشاغرة. يعطي
  أرقاماً دقيقة عن الأجور والتشغيل في القطاع المنظم حسب النشاط، لكنه لا يقيس البطالة ولا يغطي العمل خارج المنشآت المسجلة.
official_quotes:
- slot: q-ilo-qg-establishment
  heading_ar: مسوح المؤسسات عند منظمة العمل الدولية
- slot: q-ilo-ssm2-establishment-intro
  heading_ar: مسوح المؤسسات في سلسلة المصادر والطرق
what_ai_ar: >-
  تُسحب العينة من سجل المؤسسات (السجل التجاري أو سجل الضمان الاجتماعي)، ويجيب عنها قسم الموارد البشرية أو المحاسبة من سجلات
  الرواتب. لذلك تكون الأجور فيها أدق مما يصرّح به الأفراد في مسح الأسر.
strengths_ai_ar:
- أجور وتكلفة عمل دقيقة لأنها من سجلات الرواتب.
- تفصيل جيد حسب النشاط الاقتصادي وحجم المنشأة.
- تقيس الوظائف الشاغرة والطلب على العمل، وهو ما لا يقيسه مسح الأسر.
limits_ai_ar:
- تعدّ الوظائف لا الأشخاص: من له عملان يُعدّ مرتين.
- لا تغطي العمل غير المنظم ولا العاملين لحسابهم ولا الأسر التي توظّف عمالاً منزليين.
- لا تقيس البطالة.
- جودتها مرهونة بتحديث سجل المؤسسات؛ المنشآت الجديدة قد تغيب.
