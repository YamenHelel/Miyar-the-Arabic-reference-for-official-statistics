- slot: q-tun-unemployed
  source: src-tun-ins-enpe-methodo
  lang: fr
  status: verified
  text: |-
    3. Population au chômage
    La population au chômage comprend les personnes sans travail qui recherchent un emploi et qui sont
    disponibles pour travailler, conformément aux critères retenus dans le dispositif statistique. La
    détermination du chômage repose principalement sur trois critères :
    • L’absence de travail
    • La recherche d’un emploi
    • La disponibilité pour travailler.
  locator: Note méthodologique — définition du chômeur
  what_ar: انسخ تعريف «chômeur» بالفرنسية
  pasted_on: '2026-11-04'
  verified_by: YH
  translation_ar: |-
    3. السكان المتعطلون
    يشمل السكان المتعطلون الأشخاص الذين ليس لديهم عمل ويبحثون عن عمل ومتاحون للعمل، وفق المعايير المعتمدة في المنظومة الإحصائية. ويرتكز تحديد البطالة أساساً على ثلاثة معايير:
    • عدم وجود عمل
    • البحث عن عمل
    • الإتاحة للعمل.
  translation_en: |-
    3. Unemployed population
    The unemployed population comprises persons without work who are seeking employment and are available for work, in accordance with the criteria adopted in the statistical system. The determination of unemployment rests mainly on three criteria:
    • Absence of work
    • Seeking employment
    • Availability for work.
