  text: |-
    Employment
    27.Persons in employment are defined as all those of working age who, during a short reference
    period, were engaged in any activity to produce goods or provide services for pay or profit.
    They comprise:
    (a) employed persons “at work”, i.e. who worked in a job for at least one hour;
    (b) employed persons “not at work” due to temporary absence from a job, or to workingtime arrangements (such as shift work, flexitime and compensatory leave for overtime).
  locator: 19th ICLS resolution, paragraph 27
  what_ar: انسخ الفقرة 27 (تعريف الأشخاص في العمالة)
  pasted_on: '2026-11-04'
