  source: src-sau-gastat-lms-methodology-2025q1
  lang: en
  status: verified
  text: "2.3.1.19\tUnemployed persons\nThe unemployed comprise all persons of working age (15 years and older) who were:\n•\tWere without a job or business during the reference period, i.e., were not in paid employment or self-employment\n•\tCurrently available for work, i.e., were available for paid employment or self-employment during the reference week or in the following two weeks; and\n•\tSeeking work, i.e., had taken active measure during the reference week or the previous three weeks  to seek paid employment or self-employment.\nFuture starters, that is, persons who did not look for work but have a future job start are also counted as unemployed."
  locator: Methodology of Labor Market Statistics Q1 2025 — definition of unemployed
