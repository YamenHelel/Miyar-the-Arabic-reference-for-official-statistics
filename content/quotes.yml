  text: |-
    3. Population au chômage
    La population au chômage comprend les personnes sans travail qui recherchent un emploi et qui sont
    disponibles pour travailler, conformément aux critères retenus dans le dispositif statistique. La
    détermination du chômage repose principalement sur trois critères :
    • L’absence de travail
    • La recherche d’un emploi
    • La disponibilité pour travailler.
  locator: Note méthodologique — définition du chômeur
