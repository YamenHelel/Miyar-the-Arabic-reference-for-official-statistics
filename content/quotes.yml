- slot: q-ilo-unemployed
  source: src-ilo-icls19-res1-pdf
  lang: en
  status: verified
  text: |-
    Unemployment
    47.Persons in unemployment are defined as all those of working age who were not in
    employment, carried out activities to seek employment during a specified recent period and
    were currently available to take up employment given a job opportunity, where:
    (a) “not in employment” is assessed with respect to the short reference period for the
    measurement of employment;
    (b) to “seek employment” refers to any activity when carried out, during a specified recent
    period comprising the last four weeks or one month, for the purpose of finding a job
    or setting up a business or agricultural undertaking. This includes also part-time,
    informal, temporary, seasonal or casual employment, within the national territory or
    abroad. Examples of such activities are:
    (i) arranging for financial resources, applying for permits, licences;
    (ii) looking for land, premises, machinery, supplies, farming inputs;
    (iii) seeking the assistance of friends, relatives or other types of intermediaries;
    (iv) registering with or contacting public or private employment services;
    (v) applying to employers directly, checking at worksites, farms, factory gates,
    markets or other assembly places;
    (vi) placing or answering newspaper or online job advertisements;
    (vii) placing or updating résumés on professional or social networking sites online;
    (c) the point when the enterprise starts to exist should be used to distinguish between
    search activities aimed at setting up a business and the work activity itself, as evidenced
    by the enterprise’s registration to operate or by when financial resources become
    available, the necessary infrastructure or materials are in place or the first client or
    order is received, depending on the context;
    (d) “currently available” serves as a test of readiness to start a job in the present, assessed
    with respect to a short reference period comprising that used to measure employment:
    (i) depending on national circumstances, the reference period may be extended to
    include a short subsequent period not exceeding two weeks in total, so as to
    ensure adequate coverage of unemployment situations among different
    population groups.
  locator: 19th ICLS resolution, paragraph 47 (with items a, b, c)
  what_ar: انسخ نص الفقرة 47 كاملاً (تعريف الأشخاص في البطالة) بالإنجليزية كما هو
  pasted_on: '2026-11-04'
  verified_by: YH
  quoted_from_url: https://www.ilo.org/sites/default/files/wcmsp5/groups/public/@dgreports/@stat/documents/normativeinstrument/wcms_230304.pdf
  document_note: Text as published in the 19th ICLS resolution amended by Resolution II of the 21st ICLS (Geneva, 11–20 October 2023).
- slot: q-ilo-employed
  source: src-ilo-icls19-res1-pdf
  lang: en
  status: verified
  text: |-
    Employment
    27.Persons in employment are defined as all those of working age who, during a short reference
    period, were engaged in any activity to produce goods or provide services for pay or profit.
    They comprise:
    (a) employed persons “at work”, i.e. who worked in a job for at least one hour;
    (b) employed persons “not at work” due to temporary absence from a job, or to workingtime arrangements (such as shift work, flexitime and compensatory leave for overtime).
  locator: 19th ICLS resolution, paragraph 27
  what_ar: انسخ الفقرة 27 (تعريف الأشخاص في العمالة)
  pasted_on: '2026-11-04'
  verified_by: YH
  quoted_from_url: https://www.ilo.org/sites/default/files/wcmsp5/groups/public/@dgreports/@stat/documents/normativeinstrument/wcms_230304.pdf
  document_note: Text as published in the 19th ICLS resolution amended by Resolution II of the 21st ICLS (Geneva, 11–20 October 2023).
- slot: q-ilo-labour-force
  source: src-ilo-icls19-res1-pdf
  lang: en
  status: verified
  text: |-
    16.Priority is given to employment over the other two categories, and to unemployment over
    outside the labour force. The three categories of labour force status are, thus, mutually
    exclusive and exhaustive. The sum of persons in employment and in unemployment equals the
    labour force. Persons outside the labour force are those of working age who were neither in
    employment nor in unemployment in the short reference period.
  locator: 19th ICLS resolution, paragraph defining the labour force (§16 approx.)
  what_ar: انسخ الفقرة التي تعرّف القوة العاملة
  pasted_on: '2026-11-04'
  verified_by: YH
  quoted_from_url: https://www.ilo.org/sites/default/files/wcmsp5/groups/public/@dgreports/@stat/documents/normativeinstrument/wcms_230304.pdf
  document_note: Text as published in the 19th ICLS resolution amended by Resolution II of the 21st ICLS (Geneva, 11–20 October 2023).
- slot: q-ilo-lu1
  source: src-ilo-icls19-res1-pdf
  lang: en
  status: verified
  text: |-
    73.
    (c) measures of labour underutilization, of which more than one amongst the following
    headline indicators is needed so as to reflect the nature of underutilization in different
    settings and phases of the economic cycle:
    LU1: Unemployment rate:
    [persons in unemployment / labour force] x 100
    LU2: Combined rate of time-related underemployment and unemployment:
    [(persons in time-related underemployment + persons in unemployment) / labour
    force] x 100
    LU3: Combined rate of unemployment and potential labour force:
    2
    [(persons in unemployment + potential labour force) / (extended labour force)] x
    100
    2 Replaces optional relaxation of the “seeking work” criterion in the previous standards.
    LU4: Composite measure of labour underutilization:
    [(persons in time-related underemployment + persons in unemployment +
    potential labour force) / (extended labour force)] x 100
  locator: 19th ICLS resolution, paragraph listing LU1–LU4 (§71 approx.)
  what_ar: انسخ الفقرة التي تعرّف المقاييس LU1 إلى LU4 (ومنها LU1 = معدل البطالة)
  pasted_on: '2026-11-04'
  verified_by: YH
  quoted_from_url: https://www.ilo.org/sites/default/files/wcmsp5/groups/public/@dgreports/@stat/documents/normativeinstrument/wcms_230304.pdf
  document_note: Text as published in the 19th ICLS resolution amended by Resolution II of the 21st ICLS (Geneva, 11–20 October 2023). Footnote 2 (on LU3) is printed inside the quoted paragraph.
- slot: q-usa-unemployed
  source: src-usa-bls-cps-definitions
  lang: en
  status: verified
  text: |-
    Unemployed
    In the Current Population Survey, people are classified as unemployed if they meet all of the following criteria:

    They were not employed during the survey reference week.
    They were available for work during the survey reference week, except for temporary illness.
    They made at least one specific, active effort to find a job during the 4-week period ending with the survey reference week (see active job search methods) OR they were temporarily laid off and expecting to be recalled to their job.
    People waiting to start a new job must have actively looked for a job within the last 4 weeks in order to be classified as unemployed. Otherwise, they are classified as not in the labor force.
  locator: CPS definitions page — 'Unemployed persons'
  what_ar: انسخ تعريف Unemployed persons
  pasted_on: '2026-11-04'
  verified_by: YH
- slot: q-gbr-unemployed
  source: src-gbr-ons-lfs-user-guidance
  lang: en
  status: verified
  text: |-
    Unemployment
    10. (1) The "unemployed" comprise all persons above a specified age who during the reference period
    were:
    (a) "without work", i.e. were not in paid employment or self-employment as defined in
    paragraph 9;
    (b) "currently available for work", i.e. were available for paid employment or selfemployment during the reference period; and
    (c) "seeking work", i.e. had taken specific steps in a specified recent period to seek paid
    employment or self-employment. The specific steps may include registration at a public or
    private employment exchange; application to employers; checking at work sites, farms,
    factory gates, market or other assembly places; placing or answering newspaper
    advertisements: seeking assistance of friends or relatives: looking for land, building,
    machinery or equipment to establish own enterprise; arranging for financial resources;
    applying for permits and licences, etc.
  locator: LFS QMI — definition of unemployment (ILO definition)
  what_ar: انسخ تعريف البطالة المستخدم في المسح
  pasted_on: '2026-11-04'
  verified_by: YH
  quoted_from_url: https://www.ons.gov.uk/employmentandlabourmarket/peopleinwork/employmentandemployeetypes/methodologies/labourforcesurveyuserguidance#volume-5-lfs-classifications
  document_note: 'LFS User Guide – Volume 5: LFS Classifications (July 2024), p.10. ONS reproduces paragraph 10 of the 13th ICLS (1982) resolution.'
- slot: q-fra-unemployed
  source: src-fra-insee-eec-methodo
  lang: fr
  status: verified
  text: |-
    Chômage
    10.1. Les « chômeurs » comprennent toutes les personnes ayant dépassé un âge spécifié qui, au cours de la période de
    référence, étaient :
    a) « sans travail », c'est-à-dire qui n'étaient pourvues ni d'un emploi salarié ni d'un emploi non salarié ;
    b) « disponibles pour travailler » dans un emploi salarié ou non salarié durant la période de référence ;
    c) « à la recherche d'un travail », c'est-à-dire qui avaient pris des dispositions spécifiques au cours d'une période récente
    spécifiée pour chercher un emploi salarié ou un emploi non salarié. Ces dispositions spécifiques peuvent inclure :
    l'inscription à un bureau de placement public ou privé ; la candidature auprès d'employeurs ; les démarches sur les lieux
    de travail, dans les fermes ou à la porte des usines, sur les marchés ou dans les autres endroits où sont traditionnellement
    recrutés les travailleurs ; l'insertion ou la réponse à des annonces dans les journaux ; les recherches par relations
    personnelles ; la recherche de terrain, d'immeubles, de machines ou d'équipement pour créer une entreprise personnelle ;
    les démarches pour obtenir des ressources financières, des permis et licences, etc.
  locator: Méthodologie EEC — définition du chômeur au sens du BIT
  what_ar: انسخ تعريف «chômeur au sens du BIT» بالفرنسية
  pasted_on: '2026-11-04'
  verified_by: YH
  document_note: Insee methodology reproduces paragraph 10.1 of the 13th ICLS (1982) resolution in French; Insee's operational criteria (15+, availability within 2 weeks, 4-week search) are stated elsewhere.
- slot: q-aus-unemployed
  source: src-aus-abs-lscsm-2018
  lang: en
  status: verified
  text: |-
    Unemployed persons are defined as all persons aged 15 years and over who were not employed during the reference week, and:
    had actively looked for full-time or part-time work at any time in the four weeks up to the end of the reference week, and were available for work in the reference week, or
    were waiting to start a new job within four weeks from the end of the reference week, and could have started in the reference week if the job had been available then.
  locator: 'Labour Statistics: Concepts, Sources and Methods — ''Unemployed'''
  what_ar: انسخ تعريف Unemployed
  pasted_on: '2026-11-04'
  verified_by: YH
