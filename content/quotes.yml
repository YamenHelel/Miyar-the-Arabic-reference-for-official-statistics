- slot: q-ilo-lu1
  source: src-ilo-icls19-res1-pdf
  lang: en
  status: verified
  text: |-
    73.
    (c) measures of labour underutilization, of which more than one amongst the following
    headline indicators is needed so as to reflect the nature of underutilization in different
    settings and phases of the economic cycle:
    LU1: Unemployment rate:
    [persons in unemployment / labour force] x 100
    LU2: Combined rate of time-related underemployment and unemployment:
    [(persons in time-related underemployment + persons in unemployment) / labour
    force] x 100
    LU3: Combined rate of unemployment and potential labour force:
    2
    [(persons in unemployment + potential labour force) / (extended labour force)] x
    100
    2 Replaces optional relaxation of the “seeking work” criterion in the previous standards.
    LU4: Composite measure of labour underutilization:
    [(persons in time-related underemployment + persons in unemployment +
    potential labour force) / (extended labour force)] x 100
  locator: 19th ICLS resolution, paragraph listing LU1–LU4 (§71 approx.)
  what_ar: انسخ الفقرة التي تعرّف المقاييس LU1 إلى LU4 (ومنها LU1 = معدل البطالة)
