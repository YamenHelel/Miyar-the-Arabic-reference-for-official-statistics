- slot: q-mar-unemployed
  source: src-mar-hcp-chomage-strict
  lang: fr
  status: verified
  text: |-
    Personnes au chômage strict
    Les personnes au chômage strict sont les personnes de 15 ans et plus qui remplissent
    simultanément les trois conditions suivantes :
    1. Être sans emploi contre revenu au cours de la semaine précédant leur interview.
    2. Avoir recherché un travail rémunéré ou fait des démarches pour commencer un
    projet, au cours des quatre semaines précédant leur interview.
    3. Être disponible pour prendre un emploi contre revenu dans les deux semaines suivant
    leur interview ou avoir pu prendre un emploi contre revenu si une opportunité
    professionnelle s’était présentée au cours de la semaine précédant leur interview.
  locator: Note méthodologique ENE — définition de la population active en chômage
  what_ar: انسخ تعريف «chômeur / population active en chômage»
  pasted_on: '2026-11-04'
  verified_by: YH
  quoted_from_url: https://www.hcp.ma/attachment/2927551/
  document_note: HCP information note on the labour market, Q3 2026, Enquête sur la Main-d'Œuvre (EMO). The lead confirmed this is the EMO2026 definition.
- slot: q-jor-unemployed
  source: src-jor-dos-methodology
  lang: en
  status: verified
  text: |-
    Unemployed: An individual aged 15 years or older, who is capable of working, not currently working, available for work, and actively seeking employment. The following conditions must be met for someone to be considered unemployed:
    a. Not working (without work): The person must not have worked for at least one hour during the seven days before the interview and must not be temporarily absent from work.
    b. Available for work: The person must be in a position to accept a job immediately within the week preceding the interview or within the following fifteen days.
    c. Actively seeking work: The person must have taken specific steps to look for work either full-time or part-time in the recent four weeks prior to the interview. These steps may include registering and directly applying to employers, checking job postings in places of employment and community centers, placing and responding to advertisements in newspapers, inquiring about job opportunities through friends or relatives, or any similar actions.
  locator: DoS — EUS concepts and definitions (quarterly report annex)
  what_ar: انسخ تعريف «المتعطل» من التقرير الربعي أو منهجية المسح
  pasted_on: '2026-11-04'
  verified_by: YH
  quoted_from_url: https://dosweb.dos.gov.jo/labourforce/employment-and-unemployment/
- slot: q-are-unemployed
  source: src-are-lfs-methodology
  lang: ar
  status: verified
  text: "متعطل: \tهو الفرد الذي عمره/ عمرها (15) سنة فأكثر، القادر على العمل، والذي لا يزاول أي عمل، والمتاح للعمل، والباحث عنه، وتجدر الإشارة إلى أنه يجب توافر الشروط التالية في المتعطل:\n\tأ. لا يزاول أي عمل (دون عمل): أن لا يكون الشخص قد عمل لمدة ساعة فأكثر من الزمن خلال السبعة أيام التي سبقت يوم المقابلة (فترة الإسناد الزمني)، ولم يكن متغيباً بصورة مؤقتة عن العمل.\n\tب. المتاح للعمل: أي أن يكون الشخص في وضع يسمح له باستلام عمل فوراً خلال الأربعة أسابيع اللاحقة ليوم المقابلة.\n\tج. الباحث عن عمل: أن يكون الشخص قد اتخذ خطوات محددة للبحث عن عمل لبعض الوقت أو كله بصفة دائمة خلال الأربعة أسابيع التي سبقت يوم المقابلة. وقد تشمل الخطوات المحددة التسجيل في برنامج توطين، أو التسجيل في مبادرات حكومية مثل: معرض وظائف ، أو التسجيل لدى إدارة الموارد البشرية (للمواطنين فقط)، أو التقدم مباشرة إلى أصحاب العمل، والبحث في أماكن العمل وأماكن التجمعات الخاصة، ونشر إعلانات في الصحف والرد عليها، والبحث عن عمل من خلال الإنترنت والتحري عن فرص العمل لدى الأصدقاء أو الأقارب أو أي إجراء مماثل…الخ.\n\tد. ويعتبر\
    \ من ضمن المتعطلين أيضا الأشخاص المتاحون حاليا للعمل ولم يبحثوا عن العمل خلال الأربعة أسابيع السابقة ليوم المقابلة بسبب انتظارهم للعودة لعملهم السابق أو أنهم وجدوا عملا بانتظار المباشرة به لاحقا."
  locator: FCSC — LFS definitions
  what_ar: انسخ تعريف «المتعطل» من منشورات مسح القوى العاملة
  pasted_on: '2026-11-04'
