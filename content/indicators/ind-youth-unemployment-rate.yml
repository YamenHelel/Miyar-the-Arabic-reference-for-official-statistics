# Miʿyar indicator (pilot). Official wording: content/quotes.yml. facts_basis says where each fact comes from.
id: ind-youth-unemployment-rate
name_ar: معدل البطالة بين الشباب
names:
  en: Youth unemployment rate
  fr: Taux de chômage des jeunes
domain: labour
sdg:
- 8.5.2
international:
  standard_source: src-sdg-goal8-metadata
  custodian: ILO
  definition_quote: q-sdg-852-youth
  formula_ar: معدل بطالة الشباب = (المتعطلون 15–24 ÷ القوة العاملة 15–24) × 100
  formula: YUR = U(15–24) / LF(15–24) × 100
  components:
  - id: con-unemployed
    name_ar: المتعطلون
    quote: q-ilo-unemployed
  - id: con-labour-force
    name_ar: القوة العاملة
    quote: q-ilo-labour-force
  notes_ar: التعريف الدولي للشباب في إحصاءات العمل هو الفئة العمرية 15–24 سنة، ويُنشر ضمن تصنيفات مؤشر أهداف التنمية المستدامة 8.5.2.
