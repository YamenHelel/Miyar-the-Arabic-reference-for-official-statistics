comparability_notes_ar:
- text: بعض الأجهزة العربية تنشر بطالة الشباب للفئة 15–29 أو 15–34 بدل 15–24، فتنخفض النسبة لأن الفئات الأكبر سناً أقل بطالة؛ يجب التحقق من الفئة العمرية قبل أي مقارنة.
  sources:
  - src-escwa-state-lfs-arab-states-2024
- text: في الولايات المتحدة تبدأ الفئة من 16 سنة (16–24).
  sources:
  - src-usa-bls-cps-definitions
- text: في الدول ذات العمالة الوافدة الكبيرة (السعودية، الإمارات، الأردن) يختلف المؤشر كثيراً بين المواطنين وإجمالي السكان؛ يجب ذكر السكان المرجعيين مع كل رقم.
  sources:
  - src-sau-gastat-lfs-page
  - src-jor-dos-home
  - src-are-glmm-lfs-notes
explanation_ai_ar: بطالة الشباب أعلى عادة من البطالة الإجمالية بمرتين أو ثلاث، لأن الشباب في بداية مسارهم المهني وكثيرو الانتقال. يُستحسن قراءتها مع نسبة الشباب خارج التعليم والعمل والتدريب (NEET، المؤشر 8.6.1) لأن كثيراً من الشباب لا يُحسبون في القوة العاملة أصلاً.
