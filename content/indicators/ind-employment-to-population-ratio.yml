    facts_basis: quote (age, from the unemployment definition)
    definition_quote: q-jor-epr
  are:
    source: src-are-lfs-methodology
    survey: Labour Force Survey (FCSC)
    age: 15+
    frequency: annual
    facts_basis: quote (age, from the unemployment definition)
    definition_quote: q-are-epr
  pse:
    source: src-pse-pcbs-book2740
    survey: Labour Force Survey (PCBS)
    age: 15+
