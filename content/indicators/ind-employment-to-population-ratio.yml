# Miʿyar indicator (pilot). Official wording: content/quotes.yml. facts_basis says where each fact comes from.
id: ind-employment-to-population-ratio
name_ar: نسبة العمالة إلى السكان
names:
  en: Employment-to-population ratio
  fr: Taux d'emploi
term_variants:
- term: معدل التشغيل
  used_in:
  - mar
  - tun
  basis: Maghreb usage — to confirm from national texts
domain: labour
sdg: []
international:
  standard_source: src-ilo-icls19-res1-pdf
  custodian: ILO
  definition_quote: q-ilo-headline-73ab
  formula_ar: نسبة العمالة إلى السكان = (عدد المشتغلين ÷ السكان في سن العمل) × 100
  formula: EPR = E / WAP × 100
  components:
  - id: con-employed
    name_ar: المشتغلون
    quote: q-ilo-employed
  - id: con-working-age-population
    name_ar: السكان في سن العمل
    quote: q-ilo-working-age
  notes_ar: مؤشر رئيسي في قرار المؤتمر التاسع عشر (الفقرة 73)، يقيس قدرة الاقتصاد على تشغيل سكانه دون أن يتأثر بقرار البحث عن عمل.
countries:
  tun:
    source: src-tun-ins-enpe-methodo
    survey: ENPE
    age: 15+
    frequency: quarterly
    facts_basis: search-snippet
    definition_quote: q-tun-epr
  sau:
    source: src-sau-gastat-lms-methodology-2025q1
    survey: Labour Force Survey
    age: 15+
