# Pilot indicator #1 — Unemployment rate (معدل البطالة)
# Status: draft. Official wording is pending in quotes[] (status to-paste) because the sandbox cannot open the sources;
# the lead pastes them from the Verification Desk. Nothing below the quotes is official text.

id: ind-unemployment-rate
name_ar: معدل البطالة
names:
  en: Unemployment rate
  fr: Taux de chômage
term_variants:
  - {term: معدل البطالة, used_in: [sau, jor, pse, are, tun, mar], basis: common usage — to confirm per country from quotes}
  - {term: نسبة البطالة, used_in: [], basis: to confirm — collect countries that use it}
domain: labour
sdg: ["8.5.2"]

international:
  standard_source: src-ilo-icls19-res1
  custodian: ILO
  definition_quote: q-ilo-unemployed
  formula_ar: "معدل البطالة = (عدد المتعطلين ÷ القوة العاملة) × 100"
  formula: "UR = U / (E + U) × 100"
  formula_quote: q-ilo-lu1
  components:
    - {id: con-unemployed, name_ar: المتعطلون (الأشخاص في البطالة), quote: q-ilo-unemployed}
    - {id: con-labour-force, name_ar: القوة العاملة, quote: q-ilo-labour-force}
    - {id: con-employed, name_ar: المشتغلون (الأشخاص في العمالة), quote: q-ilo-employed}
  notes_ar: >
    في إطار المؤتمر الدولي التاسع عشر لخبراء إحصاءات العمل (2013) يُعدّ معدل البطالة المقياسَ الأول (LU1) من بين أربعة مقاييس رئيسية لنقص استخدام العمالة.
    يُنشر المؤشر أيضاً بوصفه مؤشر أهداف التنمية المستدامة 8.5.2، مصنفاً حسب الجنس والعمر والإعاقة، ومنظمة العمل الدولية هي الجهة الراعية.

