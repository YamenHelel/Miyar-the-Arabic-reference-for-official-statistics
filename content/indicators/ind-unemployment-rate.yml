# Pilot indicator #1 — Unemployment rate (معدل البطالة)
# Status: draft. Official wording is pending in quotes[] (status to-paste) because the sandbox cannot open the sources;
# the lead pastes them from the Verification Desk. Nothing below the quotes is official text.

id: ind-unemployment-rate
name_ar: معدل البطالة
names:
  en: Unemployment rate
  fr: Taux de chômage
term_variants:
  - {term: معدل البطالة, used_in: [sau, jor, pse, are, tun, mar], basis: common usage — to confirm per country from quotes}
  - {term: نسبة البطالة, used_in: [], basis: to confirm — collect countries that use it}
domain: labour
sdg: ["8.5.2"]

international:
  standard_source: src-ilo-icls19-res1-pdf
  custodian: ILO
  definition_quote: q-ilo-unemployed
  formula_ar: "معدل البطالة = (عدد المتعطلين ÷ القوة العاملة) × 100"
  formula: "UR = U / (E + U) × 100"
  formula_quote: q-ilo-lu1
  components:
    - {id: con-unemployed, name_ar: المتعطلون (الأشخاص في البطالة), quote: q-ilo-unemployed}
    - {id: con-labour-force, name_ar: القوة العاملة, quote: q-ilo-labour-force}
    - {id: con-employed, name_ar: المشتغلون (الأشخاص في العمالة), quote: q-ilo-employed}
  notes_ar: >
    في إطار المؤتمر الدولي التاسع عشر لخبراء إحصاءات العمل (2013) يُعدّ معدل البطالة المقياسَ الأول (LU1) من بين أربعة مقاييس رئيسية لنقص استخدام العمالة.
    يُنشر المؤشر أيضاً بوصفه مؤشر أهداف التنمية المستدامة 8.5.2، مصنفاً حسب الجنس والعمر والإعاقة، ومنظمة العمل الدولية هي الجهة الراعية.

countries:
  usa:
    source: src-usa-bls-cps-definitions
    survey: Current Population Survey (CPS)
    definition_quote: q-usa-unemployed
    standard: national (ILO-consistent)
    age: "16+"
    job_search_period: "4 weeks ending with the reference week"
    reference_period: reference week
    frequency: monthly
    availability: during the reference week (except temporary illness)
    future_starters: counted only if they searched in the last 4 weeks; temporary layoffs expecting recall are unemployed
    population_note: civilian noninstitutional population
    facts_basis: quote (search period, availability); age 16+ from search snippet
  gbr:
    source: src-gbr-ons-lfs-user-guidance
    survey: Labour Force Survey (LFS)
    definition_quote: q-gbr-unemployed
    standard: ILO-based
    age: "16+ (to confirm)"
    frequency: quarterly (rolling)
    population_note: the quoted text is the 13th ICLS (1982) wording reproduced by ONS; operational thresholds to add
    facts_basis: search-snippet
  fra:
    source: src-fra-insee-eec-methodo
    survey: Enquête Emploi en continu (EEC)
    definition_quote: q-fra-unemployed
    standard: ILO-based (EU-LFS)
    age: "15+"
    job_search_period: "4 dernières semaines (ou emploi trouvé commençant dans les 3 mois)"
    availability: "dans les 2 semaines"
    frequency: continuous, quarterly results
    population_note: the quoted text is the 13th ICLS (1982) wording reproduced by Insee; operational thresholds from search snippet
    facts_basis: search-snippet
  aus:
    source: src-aus-abs-lscsm-2018
    survey: Labour Force Survey
    definition_quote: q-aus-unemployed
    standard: ILO-based
    age: "15+"
    job_search_period: "4 weeks up to the end of the reference week"
    availability: reference week
    future_starters: counted if starting within 4 weeks and could have started in the reference week
    frequency: monthly
    facts_basis: quote
  sau:
    source: src-sau-gastat-lms-methodology-2025q1
    survey: Labour Force Survey (household telephone survey)
    definition_quote: q-sau-unemployed
    age: "15+"
    job_search_period: "reference week + previous 3 weeks"
    availability: reference week or the following 2 weeks
    future_starters: counted as unemployed
    frequency: quarterly
    population_note: Saudis and non-Saudis habitually resident; rates also published for Saudis only
    facts_basis: quote (age, search, availability); survey mode and population from search snippet
  tun:
    source: src-tun-ins-enpe-methodo
    survey: Enquête Nationale sur la Population et l'Emploi (ENPE)
    definition_quote: q-tun-unemployed
    age: "15+"
    frequency: quarterly
    facts_basis: search-snippet
  mar:
    source: src-mar-hcp-chomage-strict
    survey: "ENE (to 2025) → Enquête sur la Main-d'Œuvre EMO2026 (from Jan 2026)"
    definition_quote: q-mar-unemployed
    age: "15+"
    job_search_period: "4 weeks before the interview"
    availability: within 2 weeks after the interview (or the week before it)
    measure_note: HCP calls this «chômage strict», one of several unemployment measures
    frequency: quarterly
    population_note: series break in 2026 — state ENE or EMO2026 for every figure
    facts_basis: quote (age, search, availability); survey history from search snippet
  jor:
    source: src-jor-dos-methodology
    survey: Employment and Unemployment Survey (EUS)
    definition_quote: q-jor-unemployed
    age: "15+"
    reference_period: 7 days before the interview
    job_search_period: "4 weeks before the interview"
    availability: immediately (week before the interview) or within the following 15 days
    frequency: quarterly
    population_note: DoS publishes overall, Jordanians and non-Jordanians rates (Q1 2026 per press — 16.1% / 21.1% / 8.7%)
    facts_basis: quote (age, periods); published rates from press
  are:
    source: src-are-lfs-methodology
    survey: Labour Force Survey (FCSC)
    definition_quote: q-are-unemployed
    age: "15+"
    reference_period: 7 days before the interview
    job_search_period: "4 weeks before the interview"
    availability: within the 4 weeks after the interview
    future_starters: counted (also those waiting to return to their previous job)
    frequency: annual
    population_note: no split by nationality since 2020 (per GLMM)
    facts_basis: quote (age, periods); nationality note from GLMM
  pse:
    source: src-pse-pcbs-book2740
    survey: Labour Force Survey (PCBS)
    definition_quote: q-pse-unemployed
    age: "15+"
    frequency: quarterly + annual
    population_note: coverage of Gaza varies by round (Q3 2025 release covers the West Bank)
    facts_basis: search-snippet

comparability_notes_ar:
  - text: "الحد الأدنى للسن يختلف: 16 سنة في الولايات المتحدة مقابل 15 سنة في معظم الدول الأخرى، ما يؤثر على المقارنة المباشرة."
    sources: [src-usa-bls-cps-definitions]
  - text: "في الدول ذات النسبة المرتفعة من العمالة الوافدة (السعودية، الإمارات، الأردن) يتغير المعدل كثيراً بحسب السكان المرجعيين: المواطنون فقط أو إجمالي السكان. يجب دائماً ذكر السكان الذين يشملهم الرقم."
    sources: [src-sau-gastat-lfs-page, src-jor-dos-home, src-are-glmm-lfs-notes]
  - text: "المغرب: انتقال من البحث الوطني حول التشغيل إلى بحث القوى العاملة EMO2026 في 2026 (عينة 135 ألف أسرة)، ما قد يُحدث انقطاعاً في السلسلة الزمنية."
    sources: [src-mar-hcp-ene-to-emo-2026-note]
  - text: "قاعدة بيانات ILOSTAT للقوى العاملة (LFS) مبنية على معايير المؤتمر الثالث عشر، بينما قاعدة WORK مبنية على المؤتمر التاسع عشر؛ قد تختلف الأرقام عن الأرقام الوطنية لهذا السبب."
    sources: [src-ilo-lfs-db-description, src-ilo-work-db-description]

  - text: "فترة «الإتاحة للعمل» تختلف كثيراً بين الدول: أسبوع الإسناد فقط (أستراليا، الولايات المتحدة)، أو أسبوعان بعده (السعودية، المغرب)، أو 15 يوماً (الأردن)، أو أربعة أسابيع بعد المقابلة (الإمارات). قرار المؤتمر 19 يسمح بتمديد لا يتجاوز أسبوعين إجمالاً (الفقرة 47-د)، فالفترة الأطول تُدخل في البطالة أشخاصاً لا يُحسبون متعطلين في دول أخرى."
    sources: [src-ilo-icls19-res1-pdf, src-aus-abs-lscsm-2018, src-usa-bls-cps-definitions, src-sau-gastat-lms-methodology-2025q1, src-mar-hcp-chomage-strict, src-jor-dos-methodology, src-are-lfs-methodology]
  - text: "النصان المنسوخان للمملكة المتحدة وفرنسا هما صياغة قرار المؤتمر الثالث عشر (1982) كما يعيد مكتبا الإحصاء نشرها، لا القواعد التشغيلية الوطنية؛ أما معايير السن وفترتي البحث والإتاحة فتُذكر في أجزاء أخرى من منهجيتيهما."
    sources: [src-gbr-ons-lfs-user-guidance, src-fra-insee-eec-methodo]

explanation_ai_ar: >
  معدل البطالة يقيس نسبة الأشخاص الذين لا يعملون، ويبحثون فعلياً عن عمل، ومستعدون للبدء فيه، من بين مجموع القوة العاملة
  (أي المشتغلين والمتعطلين معاً). الشخص الذي لا يعمل ولا يبحث عن عمل لا يُحسب متعطلاً، بل يُصنَّف «خارج القوة العاملة»؛
  لذلك قد ينخفض معدل البطالة أحياناً لأن بعض الباحثين توقفوا عن البحث، لا لأنهم وجدوا عملاً. ولهذا يُستحسن قراءته
  مع مؤشرات أخرى مثل معدل المشاركة في القوة العاملة ونسبة التشغيل إلى السكان والمقاييس المركبة لنقص استخدام العمالة (LU2–LU4).

related: [ind-labour-force-participation-rate, ind-employment-to-population-ratio, ind-youth-unemployment-rate, ind-lu3, ind-lu4]

quotes:
  - {slot: q-ilo-unemployed, source: src-ilo-icls19-res1-pdf, lang: en, status: verified, text: "Unemployment\n47.Persons in unemployment are defined as all those of working age who were not in\nemployment, carried out activities to seek employment during a specified recent period and\nwere currently available to take up employment given a job opportunity, where:\n(a) “not in employment” is assessed with respect to the short reference period for the\nmeasurement of employment;\n(b) to “seek employment” refers to any activity when carried out, during a specified recent\nperiod comprising the last four weeks or one month, for the purpose of finding a job\nor setting up a business or agricultural undertaking. This includes also part-time,\ninformal, temporary, seasonal or casual employment, within the national territory or\nabroad. Examples of such activities are:\n(i) arranging for financial resources, applying for permits, licences;\n(ii) looking for land, premises, machinery, supplies, farming inputs;\n(iii) seeking the assistance of friends, relatives or other types of intermediaries;\n(iv) registering with or contacting public or private employment services;\n(v) applying to employers directly, checking at worksites, farms, factory gates,\nmarkets or other assembly places;\n(vi) placing or answering newspaper or online job advertisements;\n(vii) placing or updating résumés on professional or social networking sites online;\n(c) the point when the enterprise starts to exist should be used to distinguish between\nsearch activities aimed at setting up a business and the work activity itself, as evidenced\nby the enterprise’s registration to operate or by when financial resources become\navailable, the necessary infrastructure or materials are in place or the first client or\norder is received, depending on the context;\n(d) “currently available” serves as a test of readiness to start a job in the present, assessed\nwith respect to a short reference period comprising that used to measure employment:\n(i) depending on national circumstances, the reference period may be extended to\ninclude a short subsequent period not exceeding two weeks in total, so as to\nensure adequate coverage of unemployment situations among different\npopulation groups.",
     locator: "19th ICLS resolution, paragraph 47 (with items a, b, c)",
     what_ar: "انسخ نص الفقرة 47 كاملاً (تعريف الأشخاص في البطالة) بالإنجليزية كما هو", pasted_on: 2026-11-04, verified_by: YH, quoted_from_url: "https://www.ilo.org/sites/default/files/wcmsp5/groups/public/@dgreports/@stat/documents/normativeinstrument/wcms_230304.pdf", document_note: "Text as published in the 19th ICLS resolution amended by Resolution II of the 21st ICLS (Geneva, 11–20 October 2023)."}
  - {slot: q-ilo-employed, source: src-ilo-icls19-res1-pdf, lang: en, status: verified, text: "Employment\n27.Persons in employment are defined as all those of working age who, during a short reference\nperiod, were engaged in any activity to produce goods or provide services for pay or profit.\nThey comprise:\n(a) employed persons “at work”, i.e. who worked in a job for at least one hour;\n(b) employed persons “not at work” due to temporary absence from a job, or to workingtime arrangements (such as shift work, flexitime and compensatory leave for overtime).",
     locator: "19th ICLS resolution, paragraph 27",
     what_ar: "انسخ الفقرة 27 (تعريف الأشخاص في العمالة)", pasted_on: 2026-11-04, verified_by: YH, quoted_from_url: "https://www.ilo.org/sites/default/files/wcmsp5/groups/public/@dgreports/@stat/documents/normativeinstrument/wcms_230304.pdf", document_note: "Text as published in the 19th ICLS resolution amended by Resolution II of the 21st ICLS (Geneva, 11–20 October 2023)."}
  - {slot: q-ilo-labour-force, source: src-ilo-icls19-res1-pdf, lang: en, status: verified, text: "16.Priority is given to employment over the other two categories, and to unemployment over\noutside the labour force. The three categories of labour force status are, thus, mutually\nexclusive and exhaustive. The sum of persons in employment and in unemployment equals the\nlabour force. Persons outside the labour force are those of working age who were neither in\nemployment nor in unemployment in the short reference period.",
     locator: "19th ICLS resolution, paragraph defining the labour force (§16 approx.)",
     what_ar: "انسخ الفقرة التي تعرّف القوة العاملة", pasted_on: 2026-11-04, verified_by: YH, quoted_from_url: "https://www.ilo.org/sites/default/files/wcmsp5/groups/public/@dgreports/@stat/documents/normativeinstrument/wcms_230304.pdf", document_note: "Text as published in the 19th ICLS resolution amended by Resolution II of the 21st ICLS (Geneva, 11–20 October 2023)."}
  - {slot: q-ilo-lu1, source: src-ilo-icls19-res1-pdf, lang: en, status: verified, text: "73.\n(c) measures of labour underutilization, of which more than one amongst the following\nheadline indicators is needed so as to reflect the nature of underutilization in different\nsettings and phases of the economic cycle:\nLU1: Unemployment rate:\n[persons in unemployment / labour force] x 100\nLU2: Combined rate of time-related underemployment and unemployment:\n[(persons in time-related underemployment + persons in unemployment) / labour\nforce] x 100\nLU3: Combined rate of unemployment and potential labour force:\n2\n[(persons in unemployment + potential labour force) / (extended labour force)] x\n100\n2 Replaces optional relaxation of the “seeking work” criterion in the previous standards.\nLU4: Composite measure of labour underutilization:\n[(persons in time-related underemployment + persons in unemployment +\npotential labour force) / (extended labour force)] x 100",
     locator: "19th ICLS resolution, paragraph listing LU1–LU4 (§71 approx.)",
     what_ar: "انسخ الفقرة التي تعرّف المقاييس LU1 إلى LU4 (ومنها LU1 = معدل البطالة)", pasted_on: 2026-11-04, verified_by: YH, quoted_from_url: "https://www.ilo.org/sites/default/files/wcmsp5/groups/public/@dgreports/@stat/documents/normativeinstrument/wcms_230304.pdf", document_note: "Text as published in the 19th ICLS resolution amended by Resolution II of the 21st ICLS (Geneva, 11–20 October 2023). Footnote 2 (on LU3) is printed inside the quoted paragraph."}
  - {slot: q-usa-unemployed, source: src-usa-bls-cps-definitions, lang: en, status: verified, text: "Unemployed\nIn the Current Population Survey, people are classified as unemployed if they meet all of the following criteria:\n\nThey were not employed during the survey reference week.\nThey were available for work during the survey reference week, except for temporary illness.\nThey made at least one specific, active effort to find a job during the 4-week period ending with the survey reference week (see active job search methods) OR they were temporarily laid off and expecting to be recalled to their job.\nPeople waiting to start a new job must have actively looked for a job within the last 4 weeks in order to be classified as unemployed. Otherwise, they are classified as not in the labor force.",
     locator: "CPS definitions page — 'Unemployed persons'", what_ar: "انسخ تعريف Unemployed persons", pasted_on: 2026-11-04, verified_by: YH}
  - {slot: q-gbr-unemployed, source: src-gbr-ons-lfs-user-guidance, lang: en, status: verified, text: "Unemployment\n10. (1) The \"unemployed\" comprise all persons above a specified age who during the reference period\nwere:\n(a) \"without work\", i.e. were not in paid employment or self-employment as defined in\nparagraph 9;\n(b) \"currently available for work\", i.e. were available for paid employment or selfemployment during the reference period; and\n(c) \"seeking work\", i.e. had taken specific steps in a specified recent period to seek paid\nemployment or self-employment. The specific steps may include registration at a public or\nprivate employment exchange; application to employers; checking at work sites, farms,\nfactory gates, market or other assembly places; placing or answering newspaper\nadvertisements: seeking assistance of friends or relatives: looking for land, building,\nmachinery or equipment to establish own enterprise; arranging for financial resources;\napplying for permits and licences, etc.",
     locator: "LFS QMI — definition of unemployment (ILO definition)", what_ar: "انسخ تعريف البطالة المستخدم في المسح", pasted_on: 2026-11-04, verified_by: YH, quoted_from_url: "https://www.ons.gov.uk/employmentandlabourmarket/peopleinwork/employmentandemployeetypes/methodologies/labourforcesurveyuserguidance#volume-5-lfs-classifications", document_note: "LFS User Guide – Volume 5: LFS Classifications (July 2024), p.10. ONS reproduces paragraph 10 of the 13th ICLS (1982) resolution."}
  - {slot: q-fra-unemployed, source: src-fra-insee-eec-methodo, lang: fr, status: verified, text: "Chômage\n10.1. Les « chômeurs » comprennent toutes les personnes ayant dépassé un âge spécifié qui, au cours de la période de\nréférence, étaient :\na) « sans travail », c'est-à-dire qui n'étaient pourvues ni d'un emploi salarié ni d'un emploi non salarié ;\nb) « disponibles pour travailler » dans un emploi salarié ou non salarié durant la période de référence ;\nc) « à la recherche d'un travail », c'est-à-dire qui avaient pris des dispositions spécifiques au cours d'une période récente\nspécifiée pour chercher un emploi salarié ou un emploi non salarié. Ces dispositions spécifiques peuvent inclure :\nl'inscription à un bureau de placement public ou privé ; la candidature auprès d'employeurs ; les démarches sur les lieux\nde travail, dans les fermes ou à la porte des usines, sur les marchés ou dans les autres endroits où sont traditionnellement\nrecrutés les travailleurs ; l'insertion ou la réponse à des annonces dans les journaux ; les recherches par relations\npersonnelles ; la recherche de terrain, d'immeubles, de machines ou d'équipement pour créer une entreprise personnelle ;\nles démarches pour obtenir des ressources financières, des permis et licences, etc.",
     locator: "Méthodologie EEC — définition du chômeur au sens du BIT", what_ar: "انسخ تعريف «chômeur au sens du BIT» بالفرنسية", pasted_on: 2026-11-04, verified_by: YH, document_note: "Insee methodology reproduces paragraph 10.1 of the 13th ICLS (1982) resolution in French; Insee's operational criteria (15+, availability within 2 weeks, 4-week search) are stated elsewhere."}
  - {slot: q-aus-unemployed, source: src-aus-abs-lscsm-2018, lang: en, status: verified, text: "Unemployed persons are defined as all persons aged 15 years and over who were not employed during the reference week, and:\nhad actively looked for full-time or part-time work at any time in the four weeks up to the end of the reference week, and were available for work in the reference week, or\nwere waiting to start a new job within four weeks from the end of the reference week, and could have started in the reference week if the job had been available then.",
     locator: "Labour Statistics: Concepts, Sources and Methods — 'Unemployed'", what_ar: "انسخ تعريف Unemployed", pasted_on: 2026-11-04, verified_by: YH, quoted_from_url: "https://www.abs.gov.au/ausstats/abs@.nsf/Lookup/by%20Subject/6102.0.55.001~Feb%202018~Main%20Features~Unemployment~6"}
  - {slot: q-sau-unemployed, source: src-sau-gastat-lms-methodology-2025q1, lang: en, status: verified, text: "2.3.1.19\tUnemployed persons\nThe unemployed comprise all persons of working age (15 years and older) who were:\n•\tWere without a job or business during the reference period, i.e., were not in paid employment or self-employment\n•\tCurrently available for work, i.e., were available for paid employment or self-employment during the reference week or in the following two weeks; and\n•\tSeeking work, i.e., had taken active measure during the reference week or the previous three weeks  to seek paid employment or self-employment.\nFuture starters, that is, persons who did not look for work but have a future job start are also counted as unemployed.",
     locator: "Methodology of Labor Market Statistics Q1 2025 — definition of unemployed", what_ar: "انسخ تعريف المتعطل (ويُفضَّل النص العربي إن وُجد في النسخة العربية)", pasted_on: 2026-11-04, verified_by: YH}
  - {slot: q-tun-unemployed, source: src-tun-ins-enpe-methodo, lang: fr, status: verified, text: "3. Population au chômage\nLa population au chômage comprend les personnes sans travail qui recherchent un emploi et qui sont\ndisponibles pour travailler, conformément aux critères retenus dans le dispositif statistique. La\ndétermination du chômage repose principalement sur trois critères :\n• L’absence de travail\n• La recherche d’un emploi\n• La disponibilité pour travailler.",
     locator: "Note méthodologique — définition du chômeur", what_ar: "انسخ تعريف «chômeur» بالفرنسية", pasted_on: 2026-11-04, verified_by: YH}
  - {slot: q-mar-unemployed, source: src-mar-hcp-chomage-strict, lang: fr, status: verified, text: "Personnes au chômage strict\nLes personnes au chômage strict sont les personnes de 15 ans et plus qui remplissent\nsimultanément les trois conditions suivantes :\n1. Être sans emploi contre revenu au cours de la semaine précédant leur interview.\n2. Avoir recherché un travail rémunéré ou fait des démarches pour commencer un\nprojet, au cours des quatre semaines précédant leur interview.\n3. Être disponible pour prendre un emploi contre revenu dans les deux semaines suivant\nleur interview ou avoir pu prendre un emploi contre revenu si une opportunité\nprofessionnelle s’était présentée au cours de la semaine précédant leur interview.",
     locator: "Note méthodologique ENE — définition de la population active en chômage", what_ar: "انسخ تعريف «chômeur / population active en chômage»", pasted_on: 2026-11-04, verified_by: YH, quoted_from_url: "https://www.hcp.ma/attachment/2927551/", document_note: "HCP defines 'chômage strict' (one of several unemployment measures); confirm whether this is the EMO2026 framework."}
  - {slot: q-jor-unemployed, source: src-jor-dos-methodology, lang: en, status: verified, text: "Unemployed: An individual aged 15 years or older, who is capable of working, not currently working, available for work, and actively seeking employment. The following conditions must be met for someone to be considered unemployed:\na. Not working (without work): The person must not have worked for at least one hour during the seven days before the interview and must not be temporarily absent from work.\nb. Available for work: The person must be in a position to accept a job immediately within the week preceding the interview or within the following fifteen days.\nc. Actively seeking work: The person must have taken specific steps to look for work either full-time or part-time in the recent four weeks prior to the interview. These steps may include registering and directly applying to employers, checking job postings in places of employment and community centers, placing and responding to advertisements in newspapers, inquiring about job opportunities through friends or relatives, or any similar actions.",
     locator: "DoS — EUS concepts and definitions (quarterly report annex)", what_ar: "انسخ تعريف «المتعطل» من التقرير الربعي أو منهجية المسح", pasted_on: 2026-11-04, verified_by: YH, quoted_from_url: "https://dosweb.dos.gov.jo/labourforce/employment-and-unemployment/"}
  - {slot: q-are-unemployed, source: src-are-lfs-methodology, lang: ar, status: verified, text: "متعطل: \tهو الفرد الذي عمره/ عمرها (15) سنة فأكثر، القادر على العمل، والذي لا يزاول أي عمل، والمتاح للعمل، والباحث عنه، وتجدر الإشارة إلى أنه يجب توافر الشروط التالية في المتعطل:\n\tأ. لا يزاول أي عمل (دون عمل): أن لا يكون الشخص قد عمل لمدة ساعة فأكثر من الزمن خلال السبعة أيام التي سبقت يوم المقابلة (فترة الإسناد الزمني)، ولم يكن متغيباً بصورة مؤقتة عن العمل.\n\tب. المتاح للعمل: أي أن يكون الشخص في وضع يسمح له باستلام عمل فوراً خلال الأربعة أسابيع اللاحقة ليوم المقابلة.\n\tج. الباحث عن عمل: أن يكون الشخص قد اتخذ خطوات محددة للبحث عن عمل لبعض الوقت أو كله بصفة دائمة خلال الأربعة أسابيع التي سبقت يوم المقابلة. وقد تشمل الخطوات المحددة التسجيل في برنامج توطين، أو التسجيل في مبادرات حكومية مثل: معرض وظائف ، أو التسجيل لدى إدارة الموارد البشرية (للمواطنين فقط)، أو التقدم مباشرة إلى أصحاب العمل، والبحث في أماكن العمل وأماكن التجمعات الخاصة، ونشر إعلانات في الصحف والرد عليها، والبحث عن عمل من خلال الإنترنت والتحري عن فرص العمل لدى الأصدقاء أو الأقارب أو أي إجراء مماثل…الخ.\n\tد. ويعتبر من ضمن المتعطلين أيضا الأشخاص المتاحون حاليا للعمل ولم يبحثوا عن العمل خلال الأربعة أسابيع السابقة ليوم المقابلة بسبب انتظارهم للعودة لعملهم السابق أو أنهم وجدوا عملا بانتظار المباشرة به لاحقا.",
     locator: "FCSC — LFS definitions", what_ar: "انسخ تعريف «المتعطل» من منشورات مسح القوى العاملة", pasted_on: 2026-11-04, verified_by: YH, quoted_from_url: "https://fcsc.gov.ae/wp-content/uploads/2025/06/%D8%A7%D9%84%D8%B9%D9%84%D8%A7%D9%82%D8%A9-%D8%A8%D9%82%D9%88%D8%A9-%D8%A7%D9%84%D8%B9%D9%85%D9%84-ar.xlsx", document_note: "Definition taken from the FCSC labour force data file (xlsx, Arabic)."}
