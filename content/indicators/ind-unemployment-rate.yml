    definition_quote: q-mar-unemployed
    age: "15+"
    frequency: quarterly
    population_note: series break in 2026 — state ENE or EMO2026 for every figure
    facts_basis: search-snippet
  jor:
    source: src-jor-dos-home
    survey: Employment and Unemployment Survey (EUS)
    definition_quote: q-jor-unemployed
    age: "15+"
    frequency: quarterly
    population_note: DoS publishes overall, Jordanians and non-Jordanians rates (Q1 2026 per press — 16.1% / 21.1% / 8.7%)
    facts_basis: search-snippet
  are:
    source: src-are-fcsc-home
    survey: Labour Force Survey (FCSC)
    definition_quote: q-are-unemployed
    age: "15+"
    frequency: annual
    population_note: no split by nationality since 2020 (per GLMM)
    facts_basis: search-snippet
  pse:
    source: src-pse-pcbs-microdata-portal
    survey: Labour Force Survey (PCBS)
    definition_quote: q-pse-unemployed
    age: "15+"
    frequency: quarterly + annual
    population_note: coverage of Gaza varies by round (Q3 2025 release covers the West Bank)
    facts_basis: search-snippet

comparability_notes_ar:
  - text: "الحد الأدنى للسن يختلف: 16 سنة في الولايات المتحدة مقابل 15 سنة في معظم الدول الأخرى، ما يؤثر على المقارنة المباشرة."
    sources: [src-usa-bls-cps-definitions]
  - text: "في الدول ذات النسبة المرتفعة من العمالة الوافدة (السعودية، الإمارات، الأردن) يتغير المعدل كثيراً بحسب السكان المرجعيين: المواطنون فقط أو إجمالي السكان. يجب دائماً ذكر السكان الذين يشملهم الرقم."
    sources: [src-sau-gastat-lfs-page, src-jor-dos-home, src-are-glmm-lfs-notes]
  - text: "المغرب: انتقال من البحث الوطني حول التشغيل إلى بحث القوى العاملة EMO2026 في 2026 (عينة 135 ألف أسرة)، ما قد يُحدث انقطاعاً في السلسلة الزمنية."
    sources: [src-mar-hcp-ene-to-emo-2026-note]
  - text: "قاعدة بيانات ILOSTAT للقوى العاملة (LFS) مبنية على معايير المؤتمر الثالث عشر، بينما قاعدة WORK مبنية على المؤتمر التاسع عشر؛ قد تختلف الأرقام عن الأرقام الوطنية لهذا السبب."
    sources: [src-ilo-lfs-db-description, src-ilo-work-db-description]

explanation_ai_ar: >
  معدل البطالة يقيس نسبة الأشخاص الذين لا يعملون، ويبحثون فعلياً عن عمل، ومستعدون للبدء فيه، من بين مجموع القوة العاملة
  (أي المشتغلين والمتعطلين معاً). الشخص الذي لا يعمل ولا يبحث عن عمل لا يُحسب متعطلاً، بل يُصنَّف «خارج القوة العاملة»؛
  لذلك قد ينخفض معدل البطالة أحياناً لأن بعض الباحثين توقفوا عن البحث، لا لأنهم وجدوا عملاً. ولهذا يُستحسن قراءته
  مع مؤشرات أخرى مثل معدل المشاركة في القوة العاملة ونسبة التشغيل إلى السكان والمقاييس المركبة لنقص استخدام العمالة (LU2–LU4).

related: [ind-labour-force-participation-rate, ind-employment-to-population-ratio, ind-youth-unemployment-rate, ind-lu3, ind-lu4]

