comparability_notes_ar:
- text: الحد الأدنى للسن 16 سنة في الولايات المتحدة (والمملكة المتحدة، للتأكيد) مقابل 15 سنة في الدول الأخرى، ما يغيّر المقام ويؤثر على المقارنة المباشرة.
  sources:
  - src-usa-bls-cps-definitions
  - src-gbr-ons-lfs-user-guidance
- text: في الدول ذات العمالة الوافدة الكبيرة (السعودية، الإمارات، الأردن) يختلف المؤشر كثيراً بين المواطنين وإجمالي السكان؛ يجب ذكر السكان المرجعيين مع كل رقم.
  sources:
  - src-sau-gastat-lfs-page
  - src-jor-dos-home
  - src-are-glmm-lfs-notes
- text: انتقال الدول من معايير 1982 إلى معايير 2013 يُخرج الإنتاج للاستهلاك الذاتي من العمالة، فينخفض عدد المشتغلين والقوة العاملة في الدول ذات الزراعة المعيشية؛ قاعدة ILOSTAT للقوى العاملة (LFS) ما زالت مبنية على معايير 1982.
  sources:
  - src-ilo-icls19-res1-pdf
  - src-ilo-lfs-db-description
  - src-ilo-work-db-description
- text: مشاركة المرأة منخفضة جداً في معظم الدول العربية مقارنة بالمتوسط العالمي، لذا يُنشر المؤشر دائماً مصنفاً حسب الجنس.
  sources:
  - src-escwa-state-lfs-arab-states-2024
explanation_ai_ar: معدل المشاركة يبيّن نسبة من هم في سن العمل ومنخرطون في سوق العمل، سواء كانوا يعملون أو يبحثون عن عمل. انخفاضه قد يعني كثرة الطلاب أو ربات البيوت أو من فقدوا الأمل في إيجاد عمل؛ ولذلك يُقرأ مع معدل البطالة.
