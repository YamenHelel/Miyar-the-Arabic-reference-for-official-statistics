# Miʿyar indicator (pilot). Official wording: content/quotes.yml. facts_basis says where each fact comes from.
id: ind-labour-force-participation-rate
name_ar: معدل المشاركة في القوة العاملة
names:
  en: Labour force participation rate
  fr: Taux d'activité
term_variants:
- term: معدل النشاط الاقتصادي
  used_in:
  - mar
  - tun
  basis: Maghreb usage (calque of «taux d'activité») — to confirm from national texts
domain: labour
sdg: []
international:
  standard_source: src-ilo-icls19-res1-pdf
  custodian: ILO
  definition_quote: q-ilo-headline-73ab
  formula_ar: معدل المشاركة = (القوة العاملة ÷ السكان في سن العمل) × 100
  formula: LFPR = (E + U) / WAP × 100
  components:
  - id: con-labour-force
    name_ar: القوة العاملة
    quote: q-ilo-labour-force
  - id: con-working-age-population
    name_ar: السكان في سن العمل
    quote: q-ilo-working-age
  notes_ar: أحد المؤشرين الرئيسيين اللذين يذكرهما قرار المؤتمر التاسع عشر إلى جانب مقاييس نقص استخدام العمالة (الفقرة 73).
