explanation_ai_ar: الوزن الترجيحي هو عدد وحدات المجتمع التي تمثلها وحدة العينة. يبدأ بمقلوب احتمال الاختيار، ثم يُعدّل لعدم الاستجابة ويُعاير على إسقاطات السكان.
example_ai_ar: 'أسرة احتمال اختيارها 1 من 400: وزنها الأولي 400، أي تمثل 400 أسرة.'
in_labour_stats_ai_ar: تعديل الأوزان على إسقاطات سكانية جديدة (بعد تعداد) يغيّر المستويات المنشورة حتى دون تغيّر في سوق العمل.
