explanation_ai_ar: الرقم القياسي قياس للتغير النسبي لمتغير (أو مجموعة متغيرات) مقارنة بفترة أساس قيمتها 100. أشهره الرقم القياسي لأسعار المستهلك.
example_ai_ar: إذا كان متوسط الأجر 500 في سنة الأساس و560 اليوم، فالرقم القياسي للأجور = 112.
in_labour_stats_ai_ar: تُستعمل الأرقام القياسية للأسعار لتحويل الأجور الاسمية إلى حقيقية (المؤشر 8.5.1 وأرقام الأجور الحقيقية).
