explanation_ai_ar: 'المتوسط الحسابي هو مجموع القيم مقسوماً على عددها. سهل الحساب ويستعمل كل القيم، لكنه يتأثر كثيراً بالقيم المتطرفة: أجر واحد مرتفع جداً يرفع متوسط الأجور.'
example_ai_ar: 'أجور خمسة عمال: 300، 320، 350، 400، 2000. المتوسط = 3370 ÷ 5 = 674، وهو أعلى من أجر أربعة منهم بسبب قيمة واحدة مرتفعة.'
in_labour_stats_ai_ar: يُستعمل في متوسط ساعات العمل الأسبوعية ومتوسط الأجر؛ ويُقرأ مع الوسيط عند وجود تفاوت كبير.
