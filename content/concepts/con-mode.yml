example_ai_ar: 'في عينة من 10 عاملين، 4 في التجارة و3 في البناء و3 في الصناعة: المنوال هو «التجارة».'
in_labour_stats_ai_ar: يفيد في وصف أكثر المهن أو الأنشطة شيوعاً، وأكثر عدد ساعات عمل تكراراً (مثل 40 ساعة).
