explanation_ai_ar: المدى الربيعي هو الفرق بين الربيع الثالث والربيع الأول، أي مدى النصف الأوسط من البيانات. لا يتأثر بالقيم المتطرفة.
example_ai_ar: إذا كان Q1 = 380 وQ3 = 720، فإن IQR = 340.
in_labour_stats_ai_ar: 'يُستعمل في قاعدة اكتشاف القيم الشاذة: ما يقع خارج [Q1 − 1.5×IQR ، Q3 + 1.5×IQR].'
