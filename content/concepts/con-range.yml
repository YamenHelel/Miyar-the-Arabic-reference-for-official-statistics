explanation_ai_ar: المدى هو الفرق بين أكبر قيمة وأصغر قيمة. مقياس بسيط للتشتت، لكنه يعتمد على قيمتين فقط فيتأثر كثيراً بالقيم الشاذة.
example_ai_ar: 'أعمار الباحثين عن عمل في عينة صغيرة: 19، 23، 25، 31، 58. المدى = 58 − 19 = 39 سنة.'
in_labour_stats_ai_ar: يُستعمل للتدقيق السريع في البيانات (مثلاً اكتشاف أعمار أو ساعات عمل غير منطقية قبل المعالجة).
