category: statistical
group: descriptive
source: src-isi-glossary
definition_quote: q-isi-coefficient-of-variation
formula: CV = s / x̄ × 100
formula_basis: standard notation
explanation_ai_ar: معامل الاختلاف هو الانحراف المعياري منسوباً إلى المتوسط، بالنسبة المئوية. يسمح بمقارنة التشتت بين متغيرات بوحدات أو مستويات مختلفة.
example_ai_ar: 'متوسط الأجر 600 والانحراف المعياري 150: CV = 150 ÷ 600 × 100 = 25%.'
in_labour_stats_ai_ar: تطبّقه الأجهزة الإحصائية على الخطأ المعياري للتقدير لتحديد قابليته للنشر؛ تختلف العتبات بين الأجهزة (مثلاً نشر مع تحذير فوق عتبة معينة، وعدم النشر فوق عتبة أعلى) — تُذكر العتبة من منهجية كل جهاز.
