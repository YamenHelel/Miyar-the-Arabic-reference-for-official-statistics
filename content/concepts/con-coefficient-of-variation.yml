id: con-coefficient-of-variation
name_ar: معامل الاختلاف
names:
  en: Coefficient of variation
  fr: Coefficient de variation
term_variants:
- term: معامل التغير
  used_in: []
  basis: استعمال شائع — يُتحقق منه حسب البلد
- term: الخطأ النسبي
  used_in: []
