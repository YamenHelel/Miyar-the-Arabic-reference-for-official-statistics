explanation_ai_ar: 'كل الأخطاء غير الناتجة عن اختيار العينة: أخطاء التغطية، وعدم الاستجابة، وأخطاء القياس (صياغة السؤال، المجيب، الباحث)، وأخطاء المعالجة. لا تصغر بكبر العينة.'
example_ai_ar: سؤال يُفهم بطرق مختلفة حول «البحث عن عمل» يُحدث خطأ قياس، حتى في تعداد شامل.
in_labour_stats_ai_ar: تغيير الاستمارة أو طريقة الجمع (هاتف بدل زيارة) قد يغيّر المعدلات بسبب أخطاء غير المعاينة.
