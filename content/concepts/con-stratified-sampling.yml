explanation_ai_ar: يُقسم المجتمع إلى طبقات متجانسة (مثل المحافظات والوسط الحضري والريفي)، ثم تُسحب عينة مستقلة من كل طبقة. تحسّن الدقة وتضمن تمثيل كل طبقة.
example_ai_ar: تقسيم البلد إلى 12 محافظة × حضر/ريف = 24 طبقة، وسحب عينة من كل منها.
in_labour_stats_ai_ar: تسمح الطبقات بنشر تقديرات على مستوى المناطق؛ تختار الأجهزة الطبقات وفق مستويات النشر المطلوبة.
