explanation_ai_ar: عدم الاستجابة هو غياب بيانات عن وحدة مختارة في العينة (عدم استجابة كلية) أو عن بعض الأسئلة (عدم استجابة جزئية). يصبح مصدر تحيز إذا اختلف غير المستجيبين عن المستجيبين.
example_ai_ar: 'أسرة رفضت المقابلة: عدم استجابة كلية. فرد لم يصرّح بأجره: عدم استجابة جزئية تعالج بالإسناد.'
in_labour_stats_ai_ar: تراجع معدلات الاستجابة في مسوح القوى العاملة (كما حدث في المملكة المتحدة) يضعف الثقة في التقديرات.
