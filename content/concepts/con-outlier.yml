explanation_ai_ar: القيمة الشاذة مشاهدة تبتعد كثيراً عن بقية البيانات. قد تكون خطأ في الإدخال أو قيمة حقيقية نادرة؛ لا تُحذف قبل التحقق منها.
example_ai_ar: 'في استمارة مسح، عامل صرّح بـ 140 ساعة عمل أسبوعياً: قيمة شاذة يجب التحقق منها (خطأ إدخال؟ عدة وظائف؟).'
in_labour_stats_ai_ar: قواعد التدقيق في مسوح القوى العاملة تكتشف القيم الشاذة في الساعات والأجور قبل التقدير.
