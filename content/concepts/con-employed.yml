explanation_ai_ar: يُعدّ مشتغلاً كل من عمل ساعة واحدة على الأقل خلال فترة الإسناد القصيرة مقابل أجر أو ربح، أو كان غائباً مؤقتاً عن عمله. منذ المؤتمر التاسع عشر (2013) لم يعد إنتاج السلع للاستهلاك الذاتي يُحسب عمالة، وهو فرق مهم عن معايير 1982.
