explanation_ai_ar: تُسحب مجموعات من الوحدات المتجاورة (عناقيد، مثل المناطق التعدادية) ثم تُدرس كل الوحدات أو بعضها داخلها. تخفض التكلفة الميدانية لكنها تقلل الدقة لأن الوحدات المتجاورة متشابهة.
example_ai_ar: سحب 1200 منطقة تعدادية، ثم 12 أسرة من كل منطقة (معاينة على مرحلتين).
in_labour_stats_ai_ar: معظم مسوح القوى العاملة متعددة المراحل وعنقودية، لذلك أثر التصميم فيها أكبر من 1.
