explanation_ai_ar: 'إطار المعاينة هو القائمة أو الخريطة التي تُسحب منها العينة (مثل قائمة المناطق التعدادية والمساكن). جودته تحدد جودة العينة: النقص في الإطار يؤدي إلى تغطية ناقصة.'
example_ai_ar: إطار مسح القوى العاملة مأخوذ عادة من آخر تعداد للسكان، مع تحديث للمناطق السريعة النمو.
in_labour_stats_ai_ar: إعادة بناء الإطار بعد تعداد جديد (كما في المغرب بعد تعداد 2024) قد تُحدث انقطاعاً في السلسلة.
