explanation_ai_ar: العينة جزء من المجتمع يُختار لجمع البيانات منه، بحيث يمكن تعميم النتائج على المجتمع. في الإحصاء الرسمي تُختار العينات احتمالياً لتمكين قياس الدقة.
example_ai_ar: عينة من 16500 أسرة في كل جولة لتمثيل جميع الأسر في البلد (مثال توضيحي).
in_labour_stats_ai_ar: حجم العينة وتوزيعها يحددان المستوى الجغرافي والفئات التي يمكن نشر تقديرات موثوقة عنها.
