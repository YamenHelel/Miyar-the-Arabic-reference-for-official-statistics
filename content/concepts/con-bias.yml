explanation_ai_ar: التحيّز هو الفرق المنهجي بين متوسط التقديرات (لو كُررت العينة) والقيمة الحقيقية. على عكس خطأ المعاينة، لا يزول بزيادة حجم العينة.
example_ai_ar: إذا كان العاطلون أقل استجابة للمسح من غيرهم ولم تُصحح الأوزان، فسيُقدَّر معدل البطالة أقل من حقيقته باستمرار.
in_labour_stats_ai_ar: 'مصادره الشائعة: نقص التغطية، وعدم الاستجابة الانتقائي، وصياغة الأسئلة، ونماذج الإسناد.'
