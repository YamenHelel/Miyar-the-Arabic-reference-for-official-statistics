explanation_ai_ar: 'هم الأشخاص الذين بلغوا الحد الأدنى للسن المعتمد لقياس العمل، وهو 15 سنة في معظم الدول (16 في الولايات المتحدة). يُقسَّم هؤلاء إلى ثلاث فئات متنافية: مشتغلون، ومتعطلون، وخارج القوة العاملة؛ وهم مقام معدل المشاركة ونسبة العمالة إلى السكان.'
