explanation_ai_ar: خطأ المعاينة هو الفرق بين التقدير والقيمة الحقيقية الناتج عن دراسة عينة بدلاً من المجتمع كله. يصغر بكبر العينة، ويمكن قياسه في العينات الاحتمالية.
example_ai_ar: 'تقديران للبطالة من عينتين مختلفتين من المجتمع نفسه يعطيان 15.8% و16.3%: الفرق ناتج عن خطأ المعاينة.'
in_labour_stats_ai_ar: تفسّر تقلبات صغيرة بين ربعين متتاليين غالباً بخطأ المعاينة لا بتغير حقيقي في سوق العمل.
