explanation_ai_ar: الانحراف المعياري هو الجذر التربيعي للتباين، وبالوحدة نفسها التي قيست بها البيانات. يعبّر عن البعد المعتاد للقيم عن متوسطها.
example_ai_ar: 'للقيم 2، 4، 4، 4، 5، 5، 7، 9: الانحراف المعياري المجتمعي = √4 = 2، وانحراف العينة ≈ 2.138.'
in_labour_stats_ai_ar: 'لا يُخلط بينه وبين الخطأ المعياري: الأول يصف تشتت الأفراد، والثاني يصف دقة التقدير.'
