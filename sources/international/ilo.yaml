file_meta:
  scope: international
  title: International Labour Organization (ILO) — standards, methods, data, questionnaires
  updated: 2026-11-03
  notes: >
    Collected from web search results on 2026-11-03 (sandbox could not open sites directly).
    All entries status=collected until the CI link check and human verification.

sources:
  # ---------- ICLS standards ----------
  - id: src-ilo-icls-documents
    title_en: ICLS documents (all resolutions and guidelines) — ILOSTAT
    publisher: ILO Department of Statistics
    country: int
    type: standard
    languages: [en, fr]
    url: https://ilostat.ilo.org/about/standards/icls/icls-documents/
    date_accessed: 2026-11-03
    priority: P1
    status: verified
    link_check: "2026-11-04 403"
    verified_by: YH
    verified_date: 2026-11-04
    notes: Entry point to all ICLS resolutions. Use this to find official PDFs and any Arabic versions.

  - id: src-ilo-icls19-res1
    title_en: Resolution concerning statistics of work, employment and labour underutilization (19th ICLS, 2013), including amendments
    title_ar: القرار المتعلق بإحصاءات العمل والعمالة ونقص استخدام العمالة (المؤتمر الدولي التاسع عشر لخبراء إحصاءات العمل، 2013)
    publisher: ILO — 19th International Conference of Labour Statisticians
    country: int
    type: standard
    languages: [en, fr]
    url: https://ilostat.ilo.org/tag/methods/page/6
    date_published: 2013-10
    date_accessed: 2026-11-03
    icls_standard: 19th
    sdg_indicators: ["8.5.2", "8.6.1"]
    priority: P1
    status: verified
    link_check: "2026-11-04 403"
    verified_by: YH
    verified_date: 2026-11-04
    notes: >
      Core standard. Replaces 13th ICLS (1982) for employment/unemployment and narrows "employment" to work for pay or profit.
      Official PDF is known as wcms_230304.pdf (cited in a CEPAL training deck) — exact ilo.org URL TO-LOCATE.
      Arabic translation: TO-LOCATE (check ILO Beirut).

  - id: src-ilo-icls19-description
    title_en: Description of work statistics (19th ICLS) — ILOSTAT concepts and definitions
    publisher: ILO Department of Statistics
    country: int
    type: metadata
    languages: [en, fr]
    url: https://ilostat.ilo.org/methods/concepts-and-definitions/description-work-statistics-icls19
    date_accessed: 2026-11-03
    icls_standard: 19th
    priority: P1
    status: verified
    link_check: "2026-11-04 403"
    verified_by: YH
    verified_date: 2026-11-04
    notes: ILOSTAT WORK database follows 19th ICLS. French version exists under /fr/.

  - id: src-ilo-icls13-res1
    title_en: Resolution concerning statistics of the economically active population, employment, unemployment and underemployment (13th ICLS, 1982)
    title_ar: القرار المتعلق بإحصاءات السكان النشطين اقتصادياً والعمالة والبطالة ونقص العمالة (المؤتمر الثالث عشر، 1982)
    publisher: ILO — 13th ICLS
    country: int
    type: standard
    languages: [en]
    url: https://www.ilo.org/global/statistics-and-databases/standards-and-guidelines/resolutions-adopted-by-international-conferences-of-labour-statisticians/WCMS_087481/lang--en/index.htm
    date_published: 1982-10
    date_accessed: 2026-11-03
    icls_standard: 13th
    priority: P1
    status: verified
    link_check: "2026-11-04 200"
    verified_by: YH
    verified_date: 2026-11-04
    superseded_by: src-ilo-icls19-res1
    notes: Superseded internationally by 19th ICLS but still the basis of many national LFS and of ILOSTAT LFS database. Old ilo.org URL pattern — may redirect.

  - id: src-ilo-icls20-icse18-manual
