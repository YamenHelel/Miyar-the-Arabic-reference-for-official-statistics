    priority: P2
    status: broken
    link_check: "2026-11-04 404"
    notes: Useful source for Arabic terminology on ICSE-18 used in the Gulf.

  - id: src-ilo-icls21-informality-res
    title_en: Resolution concerning statistics on the informal economy (21st ICLS, 2023)
    title_ar: القرار المتعلق بإحصاءات الاقتصاد غير المنظم (المؤتمر الحادي والعشرون، 2023)
    publisher: ILO — 21st ICLS
    country: int
