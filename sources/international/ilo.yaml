    date_published: 2023-10
    date_accessed: 2026-11-03
    sdg_indicators: ["8.3.1"]
    priority: P1
    status: verified
    link_check: "2026-11-04 200"
    verified_by: YH
    verified_date: 2026-11-04
    notes: ICLS/21/2023/RES.I. Replaces the 1993 (15th ICLS) informal sector resolution and the 2003 (17th ICLS) informal employment guidelines.

  - id: src-ilo-icls21-news
