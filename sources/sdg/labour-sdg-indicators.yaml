file_meta:
  scope: international
  title: Labour-related SDG indicators — custodians and metadata entry points
  updated: 2026-11-03
  notes: >
    ILOSTAT states the ILO is custodian (or co-custodian) of 14 labour-related SDG indicators.
    The list and custodians below were written from ILOSTAT search snippets plus general knowledge,
    and MUST be checked against the UN metadata repository (field `custodian_check: to-verify`).
    Indicator wording is abbreviated; quote the official text from the UN metadata when building pages.
    Metadata file naming pattern on UNSD: Metadata-GG-TT-II (e.g. Metadata-08-05-02) — a .docx version was seen at
    https://mdgs.un.org/sdgs/metadata/files/Metadata-08-05-02.docx.

