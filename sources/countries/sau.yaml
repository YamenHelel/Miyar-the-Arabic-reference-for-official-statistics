profile:
  nso: {name_ar: الهيئة العامة للإحصاء, name_en: General Authority for Statistics (GASTAT), url: "https://www.stats.gov.sa"}
  lfs:
    name_en: Labour Force Survey (LFS)
    name_ar: مسح القوى العاملة
    frequency: quarterly (since 2016; first LFS 2001, bi-annual after 2006 — per GLMM)
    mode: household telephone survey (per GASTAT methodology)
    coverage: all persons 15+ habitually resident, Saudis and non-Saudis
    sample: "53,360 households (2021 Q3, per GLMM)"
    icls_standard: unknown
    age: "15+"
    classifications: [Saudi Classification of Occupations (ISCO-08 based)]
  second_source: administrative records (released separately from LFS indicators)
  to_verify: [lfs.icls_standard, lfs.sample]

