profile:
  # Miʿyar renderings of the notes below for the site's عربي / English switcher (not official text; ADR-0012)
  translation_by: "AI-assisted (Claude), 2026-11-05, not yet reviewed"
  nso_en: "High Commission for Planning (HCP)"
  notes_ar: "تغيير منهجي كبير في 2026، فيجب أن تذكر كل صفحة مؤشر المسح أو السلسلة التي يأتي منها الرقم. وقد أوضحت المندوبية (ديسمبر 2024) أن معدل البطالة في الإحصاء العام للسكان والسكنى 2024 (21.3%) غير قابل للمقارنة مع البحث الوطني حول التشغيل."
  lfs_ar:
    name_fr: "البحث الوطني حول التشغيل (ENE، 1976–2025) ← البحث حول اليد العاملة (EMO2026) ابتداءً من يناير 2026"
    frequency: "ربع سنوي، مستمر (منذ 1976)"
    sample: "نحو 90,000 أسرة سنوياً (ENE) ← 135,000 (البحث الجديد، حسب المذكرة التقنية لماي 2026)"
    icls_standard: "مختلط"
    age: "15 سنة فأكثر"
  lfs_en:
    name_fr: "National Employment Survey (ENE, 1976–2025) → Labour Force Survey (Enquête sur la Main-d'Œuvre, EMO2026), from January 2026"
  nso: {name_ar: المندوبية السامية للتخطيط, name_fr: Haut-Commissariat au Plan (HCP), url: "https://www.hcp.ma"}
  lfs:
    name_fr: "Enquête Nationale sur l'Emploi (ENE, 1976–2025) → Enquête sur la Main-d'Œuvre (EMO2026), from January 2026"
    name_ar: البحث الوطني حول التشغيل
    frequency: quarterly, continuous (since 1976)
    sample: "~90,000 households/year (ENE) → 135,000 (new survey, per May 2026 technical note)"
    icls_standard: mixed   # redesign aligned with ICLS resolutions with ILO support; parallel survey 2025
    age: "15+"
  notes: >
    Major methodology change in 2026 — every indicator page must state which survey/series a figure comes from.
    HCP clarified (Dec 2024) that the RGPH 2024 census unemployment rate (21.3%) is not comparable with ENE.
  emo2026: {first_results: "Q2 2026, published 2026-08-04 (per press, to verify on hcp.ma)", frame: 2024 census, rotation: "2-2-2", sample: "135,000 households/year"}
  to_verify: [emo2026.first_results, lfs.icls_standard, back-casting of the series to 2017 (press, ledesk.ma)]

