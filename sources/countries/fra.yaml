  lfs:
    name_fr: Enquête Emploi en continu (EEC)
    frequency: continuous, quarterly results
    framework: EU-LFS (IESS Regulation since 2021)
    unemployed_fr: "15+ sans emploi la semaine de référence, disponible sous 2 semaines, recherche active dans les 4 dernières semaines ou emploi trouvé commençant dans les 3 mois"
    icls_standard: "ILO-based (EU-LFS)"
    age: "15+"
  notes: Concept of «halo autour du chômage» (inactive close to the labour market) is a useful parallel to ILO potential labour force.

