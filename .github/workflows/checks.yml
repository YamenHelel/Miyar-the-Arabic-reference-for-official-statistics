name: checks

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly link check, Monday 04:17 UTC
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -r tools/requirements.txt
      - run: python tools/validate.py --stats
      - run: python tools/build_validation_queue.py --check
      - run: python tools/build_site.py _site && python tools/check_seo.py _site --skip-images
      - run: pip install numpy pandas && python tools/test_code.py

  links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -r tools/requirements.txt
      - run: python tools/check_links.py --report reports/link-report.md
      - name: Publish report to log and job summary
        run: |
          cat reports/link-report.md
          cat reports/link-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: reports/link-report.md
